# VidIngest Application Configuration

# Application Configuration
spring.application.name=vidingest-server

# Web server (REST API)
spring.main.web-application-type=servlet
server.port=${SERVER_PORT:8051}
server.servlet.context-path=/vidingest

# Database Configuration
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:3030}/${DB_NAME:tradingPlatformDB}
spring.datasource.username=${DB_USERNAME:dealer}
spring.datasource.password=${DB_PASSWORD:dev_dealer}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=false

# Liquibase Configuration
spring.liquibase.enabled=true
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# Actuator endpoints (metrics + health). Add micrometer-registry-prometheus to expose /actuator/prometheus.
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.show-details=when-authorized
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=simple

# Pipeline stuck-item reconciler
vidingest.reconciler.itemStaleAfter=PT1H
vidingest.reconciler.intervalMs=300000
vidingest.reconciler.initialDelayMs=60000

# ============================================================================
# YouTube channel sync
# ============================================================================
vidingest.youtube.sync.enabled=true
vidingest.youtube.sync.cron=0 0/30 * * * *
vidingest.youtube.sync.playlistLimit=200
vidingest.youtube.sync.timeoutSeconds=120

# Virtual Threads (Java 25)
spring.threads.virtual.enabled=true

# Logging
logging.level.root=INFO
logging.level.com.tradinglabs=DEBUG
logging.level.org.springframework.shell=INFO
logging.config=classpath:logback-tradinglabs-spring.xml

# Operation logging (REST)
tradinglabs.http.logging.enabled=true
tradinglabs.http.logging.event-name=vidingest.operation
tradinglabs.http.logging.debug-bodies-on-error=false
tradinglabs.http.logging.max-body-length=10000
tradinglabs.http.logging.excluded-path-prefixes=/actuator,/swagger-ui,/v3/api-docs,/swagger-ui.html,/api-docs,/favicon.ico,/api/v1/health

# ============================================================================
# VidIngest Storage Configuration
# ============================================================================
# Storage paths are automatically resolved to: package/vidingest/videos
# relative to the project root (auto-detected or set via VIDEO_KNOWLEDGE_ROOT env var)
#
# To override, uncomment and set custom paths:
# vidingest.storage.video-path=/path/to/videos
#
# Or use environment variables:
# export VIDINGEST_STORAGE_VIDEO_PATH=/path/to/videos

# ============================================================================
# Whisper transcription (ASR)
# ============================================================================
# Whisper runs as an infra container in Docker (http://whisper:9000) and can also be
# run locally (default http://localhost:9000). Override via VIDINGEST_WHISPER_BASE_URL.
vidingest.whisper.base-url=${VIDINGEST_WHISPER_BASE_URL:http://localhost:9000}

# ============================================================================
# Speaker diarization (M2)
# ============================================================================
# Diarize-ASR sidecar wraps pyannote.audio 3.x. Defaults to disabled — flip the master
# switch on a deployment that has HUGGINGFACE_TOKEN configured for the sidecar.
vidingest.diarization.enabled=${VIDINGEST_DIARIZATION_ENABLED:false}
vidingest.diarization.base-url=${VIDINGEST_DIARIZATION_BASE_URL:http://localhost:9001}
# Optional speaker count hints (pyannote uses them as bounds for clustering).
# vidingest.diarization.min-speakers=
vidingest.diarization.max-speakers=${VIDINGEST_DIARIZATION_MAX_SPEAKERS:8}
# Minimum overlap (seconds) between a diarization window and a transcription segment for
# the segment to be tagged with that speaker. Filters out spurious sub-frame overlaps.
vidingest.diarization.min-overlap-seconds=${VIDINGEST_DIARIZATION_MIN_OVERLAP_SECONDS:0.25}

# ============================================================================
# Frame sampling (M3)
# ============================================================================
# Runs ffmpeg locally — no new sidecar — to write keyframes under the per-video folder at
# {videoPath}/{channelName}/{baseName}/frames/NNNN.jpg. JPGs cascade on video delete.
# Disabled by default. Subsequent phases (M4 OCR, future M9 vision captioning) consume the
# resulting VideoFrame rows.
vidingest.frames.enabled=${VIDINGEST_FRAMES_ENABLED:false}
vidingest.frames.interval-seconds=${VIDINGEST_FRAMES_INTERVAL_SECONDS:10}
vidingest.frames.scene-change-threshold=${VIDINGEST_FRAMES_SCENE_CHANGE_THRESHOLD:0.35}
vidingest.frames.max-frames-per-video=${VIDINGEST_FRAMES_MAX_PER_VIDEO:600}
vidingest.frames.frames-dir-name=${VIDINGEST_FRAMES_DIR_NAME:frames}
vidingest.frames.jpeg-quality=${VIDINGEST_FRAMES_JPEG_QUALITY:2}
vidingest.frames.interval-classification-tolerance=${VIDINGEST_FRAMES_INTERVAL_CLASSIFICATION_TOLERANCE:0.5}
vidingest.frames.ffmpeg-timeout=${VIDINGEST_FRAMES_FFMPEG_TIMEOUT:PT20M}

# ============================================================================
# OCR (M4)
# ============================================================================
# PaddleOCR sidecar (default port 8002, image built from package/vidingest/paddleocr-server).
# Runs on the JPGs that the frame-sampling phase wrote alongside the video — both services
# share the /data/videos volume so the sidecar can read by path. Defaults to disabled.
vidingest.ocr.enabled=${VIDINGEST_OCR_ENABLED:false}
vidingest.ocr.base-url=${VIDINGEST_OCR_BASE_URL:http://localhost:8002}
vidingest.ocr.languages=${VIDINGEST_OCR_LANGUAGES:en}
vidingest.ocr.min-confidence=${VIDINGEST_OCR_MIN_CONFIDENCE:0.5}
vidingest.ocr.min-lines-per-frame=${VIDINGEST_OCR_MIN_LINES_PER_FRAME:1}
vidingest.ocr.max-results-per-video=${VIDINGEST_OCR_MAX_RESULTS_PER_VIDEO:10000}
vidingest.ocr.connect-timeout=${VIDINGEST_OCR_CONNECT_TIMEOUT:5s}
vidingest.ocr.read-timeout=${VIDINGEST_OCR_READ_TIMEOUT:2m}

# ============================================================================
# Multi-modal fusion (M5)
# ============================================================================
# Pure-Java windowing pass that merges transcript segments + speakers + OCR into
# MultimodalSegment rows — the uniform input the M6 KNOWLEDGE phase consumes. Cheap to run
# and produces empty output when there's nothing to fuse, so defaults to enabled.
vidingest.fusion.enabled=${VIDINGEST_FUSION_ENABLED:true}
vidingest.fusion.window-seconds=${VIDINGEST_FUSION_WINDOW_SECONDS:30.0}
vidingest.fusion.window-overlap-seconds=${VIDINGEST_FUSION_WINDOW_OVERLAP_SECONDS:5.0}
vidingest.fusion.min-window-seconds=${VIDINGEST_FUSION_MIN_WINDOW_SECONDS:1.0}
vidingest.fusion.max-segments-per-video=${VIDINGEST_FUSION_MAX_SEGMENTS_PER_VIDEO:2000}

# ============================================================================
# Knowledge extraction (M6)
# ============================================================================
# LLM-driven extraction of typed knowledge units (ENTITY, TOPIC, SUMMARY, CLAIM, QUESTION)
# from the multimodal segments produced by M5. Default provider is Ollama running the same
# daemon that backs the existing embeddings client — just a different model.
vidingest.knowledge.enabled=${VIDINGEST_KNOWLEDGE_ENABLED:false}
vidingest.knowledge.provider=${VIDINGEST_KNOWLEDGE_PROVIDER:ollama}
vidingest.knowledge.chat-model=${VIDINGEST_KNOWLEDGE_CHAT_MODEL:qwen2.5:14b-instruct}
vidingest.knowledge.base-url=${VIDINGEST_KNOWLEDGE_BASE_URL:${VIDINGEST_OLLAMA_BASE_URL:http://localhost:11434}}
vidingest.knowledge.temperature=${VIDINGEST_KNOWLEDGE_TEMPERATURE:0.2}
vidingest.knowledge.max-output-tokens=${VIDINGEST_KNOWLEDGE_MAX_OUTPUT_TOKENS:4096}
vidingest.knowledge.max-input-chars-per-batch=${VIDINGEST_KNOWLEDGE_MAX_INPUT_CHARS_PER_BATCH:16000}
vidingest.knowledge.max-units-per-video=${VIDINGEST_KNOWLEDGE_MAX_UNITS_PER_VIDEO:300}
vidingest.knowledge.min-salience=${VIDINGEST_KNOWLEDGE_MIN_SALIENCE:0.2}
vidingest.knowledge.embed-content=${VIDINGEST_KNOWLEDGE_EMBED_CONTENT:true}
vidingest.knowledge.connect-timeout=${VIDINGEST_KNOWLEDGE_CONNECT_TIMEOUT:5s}
vidingest.knowledge.read-timeout=${VIDINGEST_KNOWLEDGE_READ_TIMEOUT:10m}

# ============================================================================
# Download Tool Configuration
# ============================================================================
vidingest.download.tool=yt-dlp
#
# Optional: configure a JS runtime list for yt-dlp's extraction logic.
# Example: vidingest.download.js-runtimes=deno
# vidingest.download.js-runtimes=

# ============================================================================
# Video Format & Quality Configuration
# ============================================================================
# Format selector: Choose video/audio quality and format
# Examples:
#   - "bestvideo+bestaudio" - Best quality video + best quality audio (default)
#   - "best" - Best single file (video+audio combined)
#   - "worst" - Worst quality (smallest file)
#   - "bestvideo[height<=1080]+bestaudio/best[height<=1080]" - Max 1080p
#   - "bestvideo[height<=720]+bestaudio/best[height<=720]" - Max 720p
#   - "bestvideo[ext=mp4]+bestaudio[ext=m4a]/best[ext=mp4]" - MP4 container only
vidingest.download.format=bestvideo+bestaudio

# Preferred container format (mp4, webm, mkv, avi, flv, mov)
vidingest.download.container=mp4

# ============================================================================
# Audio Configuration
# ============================================================================
# Preferred audio codec: aac, mp3, opus, vorbis, m4a
#vidingest.download.audio-codec=aac
# Audio bitrate in kbps: 320, 256, 192, 128, 96
# vidingest.download.audio-bitrate=

# ============================================================================
# Download Options
# ============================================================================
vidingest.download.retries=3
# Execution timeout in seconds (0 = no timeout); applies to download and metadata commands
vidingest.download.timeout-seconds=1800

# ============================================================================
# Subtitle Configuration
# ============================================================================
# vidingest.download.subtitles=false
# vidingest.download.subtitle-languages=
# vidingest.download.subtitle-format=vtt
# vidingest.download.subtitles-separate=true

# ============================================================================
# Thumbnail Configuration
# ============================================================================
# vidingest.download.thumbnail=false
# vidingest.download.thumbnail-format=jpg

# ============================================================================
# Post-Processing Options
# ============================================================================
# vidingest.download.embed-metadata=true
# vidingest.download.embed-subtitles=false
# vidingest.download.embed-thumbnail=false
# vidingest.download.embed-chapters=false
# vidingest.download.write-info-json=false
# vidingest.download.write-description=false

# ============================================================================
# Advanced Options
# ============================================================================
# vidingest.download.restrict-filenames=true
# vidingest.download.windows-filenames=false
# vidingest.download.concurrent-fragments=1

# ============================================================================
# Semantic Search
# ============================================================================
# Semantic search + context chunk generation.
#
# Defaults:
# - Enabled for local runs.
# - Uses Ollama embeddings by default (override with env vars or switch to openai-compatible provider).
vidingest.search.semantic-enabled=true
vidingest.search.embeddings.provider=${VIDINGEST_EMBEDDINGS_PROVIDER:ollama}
vidingest.search.embeddings.expected-dimensions=${VIDINGEST_EMBEDDINGS_EXPECTED_DIMENSIONS:1536}
vidingest.search.embeddings.timeout=${VIDINGEST_OLLAMA_TIMEOUT:${VIDINGEST_EMBEDDINGS_TIMEOUT:180s}}
vidingest.search.embeddings.ollama.base-url=${VIDINGEST_OLLAMA_BASE_URL:http://localhost:11434}
vidingest.search.embeddings.ollama.embed-model=${VIDINGEST_OLLAMA_EMBED_MODEL:rjmalagon/gte-qwen2-1.5b-instruct-embed-f16}
vidingest.search.embeddings.ollama.truncate=${VIDINGEST_OLLAMA_TRUNCATE:true}
vidingest.search.embeddings.base-url=${VIDINGEST_EMBEDDINGS_BASE_URL:}
vidingest.search.embeddings.model=${VIDINGEST_EMBEDDINGS_MODEL:text-embedding-3-small}
vidingest.search.embeddings.api-key=${VIDINGEST_EMBEDDINGS_API_KEY:}
