# Dev profile: verbose SQL and transaction logging for local development
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.use_sql_comments=true
spring.jpa.properties.hibernate.show_sql=true

logging.level.org.springframework.transaction=DEBUG
logging.level.org.springframework.orm.jpa=DEBUG
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=TRACE
logging.level.liquibase=DEBUG
logging.level.liquibase.changelog=DEBUG
logging.level.liquibase.database=DEBUG
logging.level.liquibase.executor=DEBUG
logging.level.org.springframework.boot.autoconfigure.liquibase=DEBUG

# Semantic search (local/dev defaults)
vidingest.search.semantic-enabled=true
vidingest.search.embeddings.provider=${VIDINGEST_EMBEDDINGS_PROVIDER:openai-compatible}
vidingest.search.embeddings.expected-dimensions=${VIDINGEST_EMBEDDINGS_EXPECTED_DIMENSIONS:1536}
vidingest.search.embeddings.timeout=${VIDINGEST_EMBEDDINGS_TIMEOUT:180s}

# Ollama embeddings (preferred local/dev)
vidingest.search.embeddings.ollama.base-url=${VIDINGEST_LLM_BASE_URL:http://localhost:11434}
vidingest.search.embeddings.ollama.embed-model=${VIDINGEST_EMBEDDINGS_OLLAMA_MODEL:rjmalagon/gte-qwen2-1.5b-instruct-embed-f16}
vidingest.search.embeddings.ollama.truncate=${VIDINGEST_EMBEDDINGS_OLLAMA_TRUNCATE:true}

# OpenAI-compatible embeddings (optional)
vidingest.search.embeddings.base-url=${VIDINGEST_EMBEDDINGS_BASE_URL:http://localhost:8000/v1}
vidingest.search.embeddings.model=${VIDINGEST_EMBEDDINGS_MODEL:Qwen3-Embedding-4B-4bit-DWQ}
vidingest.search.embeddings.api-key=${VIDINGEST_EMBEDDINGS_API_KEY:}
vidingest.search.embeddings.dimensions=${VIDINGEST_EMBEDDINGS_DIMENSIONS:1536}

# Transcription + knowledge chat against the same local runtime (oMLX on :8000 by default).
vidingest.transcription.provider=${VIDINGEST_TRANSCRIPTION_PROVIDER:openai-compatible}
vidingest.transcription.base-url=${VIDINGEST_TRANSCRIPTION_BASE_URL:http://localhost:8000/v1}
vidingest.knowledge.provider=${VIDINGEST_KNOWLEDGE_PROVIDER:openai-compatible}
vidingest.knowledge.base-url=${VIDINGEST_KNOWLEDGE_BASE_URL:${VIDINGEST_LLM_BASE_URL:http://localhost:8000/v1}}
