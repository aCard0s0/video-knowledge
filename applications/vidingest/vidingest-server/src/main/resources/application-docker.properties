# VidIngest Docker Configuration
# Profile activated via SPRING_PROFILES_ACTIVE=docker

server.port=${SERVER_PORT:8051}

# Database Configuration (Docker networking)
spring.datasource.url=jdbc:postgresql://${DB_HOST:postgres}:${DB_PORT:5432}/${DB_NAME:tradingPlatformDB}
spring.datasource.username=${DB_USERNAME:dealer}
spring.datasource.password=${DB_PASSWORD:dev_dealer}

# Storage paths inside the container
vidingest.storage.video-path=/data/videos

# yt-dlp: help YouTube downloads pass modern JS challenges
vidingest.download.js-runtimes=${VIDINGEST_DOWNLOAD_JS_RUNTIMES:deno}
vidingest.download.remote-components=${VIDINGEST_DOWNLOAD_REMOTE_COMPONENTS:ejs:github}

# Transcription (docker: the host runtime, since there is no whisper container any more).
# Note the ${...} indirection — this line used to hardcode http://whisper:9000, which silently
# made VIDINGEST_WHISPER_BASE_URL a no-op under compose.
vidingest.transcription.provider=${VIDINGEST_TRANSCRIPTION_PROVIDER:openai-compatible}
vidingest.transcription.base-url=${VIDINGEST_TRANSCRIPTION_BASE_URL:http://host.docker.internal:8000/v1}
vidingest.transcription.model=${VIDINGEST_TRANSCRIPTION_MODEL:whisper-1}
vidingest.transcription.api-key=${VIDINGEST_TRANSCRIPTION_API_KEY:}

# Semantic search (docker)
vidingest.search.semantic-enabled=${VIDINGEST_SEARCH_SEMANTIC_ENABLED:true}
vidingest.search.embeddings.provider=${VIDINGEST_EMBEDDINGS_PROVIDER:openai-compatible}
vidingest.search.embeddings.expected-dimensions=${VIDINGEST_EMBEDDINGS_EXPECTED_DIMENSIONS:1536}
vidingest.search.embeddings.timeout=${VIDINGEST_EMBEDDINGS_TIMEOUT:180s}

# Ollama-native embeddings. No longer the default and no longer a container: kept so an operator
# can point the EMBEDDINGS connection at an ollama on the host or on another machine.
vidingest.search.embeddings.ollama.base-url=${VIDINGEST_OLLAMA_BASE_URL:http://host.docker.internal:11434}
vidingest.search.embeddings.ollama.embed-model=${VIDINGEST_EMBEDDINGS_OLLAMA_MODEL:rjmalagon/gte-qwen2-1.5b-instruct-embed-f16}
vidingest.search.embeddings.ollama.truncate=${VIDINGEST_EMBEDDINGS_OLLAMA_TRUNCATE:true}

# OpenAI-compatible embeddings — the docker default, served by the host LLM runtime.
# host.docker.internal resolves to the host from inside the container (Docker Desktop provides it;
# compose adds an extra_hosts entry so the same file works on Linux).
vidingest.search.embeddings.base-url=${VIDINGEST_EMBEDDINGS_BASE_URL:http://host.docker.internal:8000/v1}
vidingest.search.embeddings.model=${VIDINGEST_EMBEDDINGS_MODEL:text-embedding-3-small}
vidingest.search.embeddings.api-key=${VIDINGEST_EMBEDDINGS_API_KEY:}

# Knowledge extraction chat (docker: the host LLM runtime).
vidingest.knowledge.provider=${VIDINGEST_KNOWLEDGE_PROVIDER:openai-compatible}
vidingest.knowledge.base-url=${VIDINGEST_KNOWLEDGE_BASE_URL:${VIDINGEST_LLM_BASE_URL:http://host.docker.internal:8000/v1}}
