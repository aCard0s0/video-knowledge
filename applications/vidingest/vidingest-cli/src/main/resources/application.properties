spring.application.name=vidingest-cli

spring.main.web-application-type=none

spring.shell.interactive.enabled=true
spring.shell.noninteractive.enabled=false

# Default server base URL (override via env or CLI config)
vidingest.server.base-url=http://localhost:8051/vidingest

# Client timeouts (downloads/ingest can be long-running)
vidingest.server.connect-timeout=5s
vidingest.server.read-timeout=10m

logging.config=classpath:logback-tradinglabs-spring.xml

