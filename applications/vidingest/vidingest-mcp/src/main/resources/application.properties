# VidIngest MCP Application Configuration (standalone MCP server delegating to vidingest-server)

spring.application.name=vidingest-mcp
spring.threads.virtual.enabled=true

server.port=${SERVER_PORT:8055}
server.servlet.context-path=/vidingest

# MCP Server Configuration
spring.ai.mcp.server.enabled=true
spring.ai.mcp.server.name=vidingest
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.type=SYNC

# Downstream VidIngest server (HTTP)
vidingest.server.base-url=${VIDINGEST_SERVER_BASE_URL:http://localhost:8051/vidingest}
vidingest.server.connect-timeout=${VIDINGEST_SERVER_CONNECT_TIMEOUT:5s}
vidingest.server.read-timeout=${VIDINGEST_SERVER_READ_TIMEOUT:10m}

# Actuator
management.endpoints.web.exposure.include=health,info
management.info.build.enabled=true
management.info.git.enabled=true
management.info.git.mode=simple

# Logging
logging.level.com.tradinglabs=INFO
logging.level.org.springframework.ai.mcp=DEBUG
logging.level.io.modelcontextprotocol.spec.McpServerSession=ERROR
logging.config=classpath:logback-tradinglabs-spring.xml

# MCP operation logging (structured)
tradinglabs.mcp.logging.enabled=true
tradinglabs.mcp.logging.event-name=vidingest.operation
tradinglabs.mcp.logging.include-tool-description=true

