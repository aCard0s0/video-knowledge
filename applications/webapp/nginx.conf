# The operator console, served on its own.
#
# The one rule this file exists to keep: the console must stay **same-origin** with the API. Every
# request the app makes is relative (`API_BASE = '/vidingest'`), there is no environment file and
# there is no CORS configuration on the server — so serving the bundle from a different origin than
# the API would break every call. nginx therefore proxies the server's own prefixes rather than the
# app knowing where the server lives.
#
# The four proxied prefixes mirror SpaStaticResourceConfig.SERVER_PREFIXES exactly. If a prefix is
# added there, add it here: a path that should reach the server but does not match below falls into
# the SPA branch and returns index.html with a 200, which reads as a mysteriously blank screen
# rather than a 404.

server {
    # 8080, not 80: the unprivileged nginx image runs as a non-root user and cannot bind a
    # privileged port. Compose maps the host port.
    listen 8080;
    server_name _;

    # Without this, `return 302 /vidingest/` is expanded to an absolute URL using the *listen*
    # port, so a browser on the mapped host port is redirected to localhost:8080 and hangs.
    absolute_redirect off;

    root /usr/share/nginx/html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/plain application/javascript application/json image/svg+xml;

    # Everything the server owns.
    location ~ ^/vidingest/(api/|actuator|v3/|swagger-ui) {
        proxy_pass http://vidingest:8051;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # POST /videos/{id}/phases/{phase}/run re-executes a phase **synchronously**, and a
        # TRANSCRIBE rerun on a long video is minutes. The default 60s would cut the console off
        # from a request the server is still happily working on.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;

        # Frame images and the raw video file stream through here; buffering them to disk first
        # adds latency and temp files for no gain.
        proxy_buffering off;
    }

    # The console. `root` + a /vidingest/ subdirectory rather than `alias`, because alias combined
    # with try_files is the classic nginx footgun where $uri is resolved against the wrong prefix.
    location /vidingest/ {
        try_files $uri $uri/ /vidingest/index.html;
    }

    # The shell must never be cached: the hashed bundles it points at change on every deploy, and a
    # stale index.html asks for chunks that are no longer there. The hashed assets themselves are
    # immutable and get the opposite treatment below.
    location = /vidingest/index.html {
        add_header Cache-Control "no-store, must-revalidate";
    }

    location ~* ^/vidingest/.*\.(?:js|css|woff2?|svg|png|jpe?g|gif|ico)$ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The app lives under the server's context path, so the bare root would otherwise 404.
    location = / {
        return 302 /vidingest/;
    }
}
