# Base compose file for VidIngest.
#
# Defines the shared network and named volumes. The actual services live in
# split files, layered on top of this base by ./vk:
#   - compose/infra/infra.yml   postgres, diarize-asr, paddleocr-server
#   - compose/services.yml      vidingest       (REST server) + webapp (console)
#   - compose/cli.yml           vidingest-cli   (Spring Shell console)
#   - compose/mcp.yml           vidingest-mcp   (MCP SSE server)
services: {}

networks:
  video-knowledge:
    name: video-knowledge

volumes:
  postgres_data:
  # ollama_data is gone with the llm service: inference now runs on the host, which keeps its own
  # models. `down --volumes` will not remove it, so reclaim the old one by hand once you are sure:
  #   docker volume rm video-knowledge_ollama_data
  # ai_models still backs the two sidecars' model caches.
  ai_models:
  vidingest_data:
  app_logs:
