x-java-build-args: &java_build_args
  JDK_IMAGE: ${JDK_IMAGE:-eclipse-temurin:26-jdk-alpine}
  JRE_IMAGE: ${JRE_IMAGE:-eclipse-temurin:26-jre-alpine}
  MAVEN_VERSION: ${MAVEN_VERSION:-3.9.11}
  APP_UID: ${APP_UID:-1000}
  APP_GID: ${APP_GID:-1000}
  GIT_COMMIT: ${VK_GIT_COMMIT:-unknown}
  GIT_BRANCH: ${VK_GIT_BRANCH:-unknown}
  GIT_COMMIT_TIME: ${VK_GIT_COMMIT_TIME:-unknown}

services:
  vidingest:
    build:
      context: .
      dockerfile: applications/vidingest/vidingest-server/Dockerfile
      args:
        <<: *java_build_args
    image: video-knowledge/vidingest:${VK_IMAGE_TAG:-latest}
    ports:
      - '${VK_BIND_ADDR:-127.0.0.1}:${VIDINGEST_PORT:-8051}:${VIDINGEST_PORT:-8051}'
    environment:
      SPRING_PROFILES_ACTIVE: docker
      LOG_DIR: /app/logs
      # ProjectPathResolver walks up looking for the root pom.xml, which the runtime image does
      # not ship, and warns twice on every boot when it gives up. /app is the root here. Only a
      # fallback for vidingest.storage.video-path, which the docker profile always sets.
      VIDEO_KNOWLEDGE_ROOT: /app
      SERVER_PORT: ${VIDINGEST_PORT:-8051}
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/tradingPlatformDB
      SPRING_DATASOURCE_USERNAME: dealer
      SPRING_DATASOURCE_PASSWORD: dev_dealer
      SPRING_DATASOURCE_HIKARI_MAXIMUM_POOL_SIZE: ${VK_HIKARI_MAX_POOL_SIZE:-10}
      SPRING_DATASOURCE_HIKARI_MINIMUM_IDLE: ${VK_HIKARI_MIN_IDLE:-1}
      # Concurrent pipeline items. Keep <= the Hikari pool size above.
      VIDINGEST_INGESTION_CONCURRENCY: ${VIDINGEST_INGESTION_CONCURRENCY:-4}
      # Hard ceiling on the TRANSCRIBE/DIARIZE audio extract. Frame sampling has its own below.
      VIDINGEST_FFMPEG_TIMEOUT: ${VIDINGEST_FFMPEG_TIMEOUT:-PT20M}
      # Stuck-item reconciler. itemStaleAfter also bounds how long an item orphaned by a dead
      # process waits before it becomes retryable, so it is worth tuning per deployment.
      VIDINGEST_RECONCILER_ITEMSTALEAFTER: ${VIDINGEST_RECONCILER_ITEMSTALEAFTER:-PT1H}
      VIDINGEST_RECONCILER_INTERVALMS: ${VIDINGEST_RECONCILER_INTERVALMS:-300000}
      VIDINGEST_LEASE_TTL: ${VIDINGEST_LEASE_TTL:-PT10M}
      # --- Model runtimes -----------------------------------------------------------------
      # Everything below is a *starting* value. All of it is editable at runtime through
      # PUT /api/v1/connections/{name}, and an override stored there wins over these on restart.
      #
      # The default is the host runtime (oMLX and friends speak the OpenAI wire format), because a
      # container cannot reach the GPU. See VK_HOST_LLM_URL in compose/ports.env for the two things
      # the host process has to get right: bind 0.0.0.0, and serve a real embedding model.
      VIDINGEST_LLM_BASE_URL: ${VK_HOST_LLM_URL:-http://host.docker.internal:8000/v1}

      # Semantic search + embeddings.
      VIDINGEST_SEARCH_SEMANTIC_ENABLED: ${VIDINGEST_SEARCH_SEMANTIC_ENABLED:-true}
      VIDINGEST_EMBEDDINGS_PROVIDER: ${VIDINGEST_EMBEDDINGS_PROVIDER:-openai-compatible}
      VIDINGEST_EMBEDDINGS_EXPECTED_DIMENSIONS: ${VIDINGEST_EMBEDDINGS_EXPECTED_DIMENSIONS:-1536}
      VIDINGEST_EMBEDDINGS_BASE_URL: ${VIDINGEST_EMBEDDINGS_BASE_URL:-${VK_HOST_LLM_URL:-http://host.docker.internal:8000/v1}}
      # Must name a model the host serves *as an embedding model*. oMLX classifies a causal-LM
      # embedder by looking for "embed" in the directory name, so gte-Qwen2 is filed as an LLM and
      # rejected on /v1/embeddings whatever its width.
      VIDINGEST_EMBEDDINGS_MODEL: ${VIDINGEST_EMBEDDINGS_MODEL:-Qwen3-Embedding-4B-4bit-DWQ}
      # Qwen3-Embedding-4B is natively 2560-wide; the pgvector column is VECTOR(1536). The model is
      # Matryoshka-trained, so the server truncates on request. Only ever downward — asking a
      # 1024-wide model for 1536 fails at the server.
      VIDINGEST_EMBEDDINGS_DIMENSIONS: ${VIDINGEST_EMBEDDINGS_DIMENSIONS:-1536}
      VIDINGEST_EMBEDDINGS_API_KEY: ${VIDINGEST_EMBEDDINGS_API_KEY:-}
      VIDINGEST_EMBEDDINGS_TIMEOUT: ${VIDINGEST_EMBEDDINGS_TIMEOUT:-180s}
      # Used only when the EMBEDDINGS connection is switched back to provider=ollama, which is
      # still supported — it just is not a container any more.
      VIDINGEST_OLLAMA_BASE_URL: ${VIDINGEST_OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      VIDINGEST_EMBEDDINGS_OLLAMA_MODEL: ${VIDINGEST_EMBEDDINGS_OLLAMA_MODEL:-rjmalagon/gte-qwen2-1.5b-instruct-embed-f16}
      VIDINGEST_EMBEDDINGS_OLLAMA_TRUNCATE: ${VIDINGEST_EMBEDDINGS_OLLAMA_TRUNCATE:-true}

      # Transcription (TRANSCRIBE). whisper-asr points at an openai-whisper-asr-webservice;
      # openai-compatible posts /audio/transcriptions and needs a base URL ending in /v1.
      VIDINGEST_TRANSCRIPTION_PROVIDER: ${VIDINGEST_TRANSCRIPTION_PROVIDER:-openai-compatible}
      VIDINGEST_TRANSCRIPTION_BASE_URL: ${VIDINGEST_TRANSCRIPTION_BASE_URL:-${VK_HOST_LLM_URL:-http://host.docker.internal:8000/v1}}
      VIDINGEST_TRANSCRIPTION_MODEL: ${VIDINGEST_TRANSCRIPTION_MODEL:-whisper-large-v3-turbo}
      VIDINGEST_TRANSCRIPTION_API_KEY: ${VIDINGEST_TRANSCRIPTION_API_KEY:-}
      # Vocabulary hint for whisper, set to the domain this deployment ingests. Measured on a
      # trading short, 3 deterministic runs per arm: 9 mangled domain terms became 3 — "break of
      # structure" fully fixed, "fib retracement" still coming back as "fiber retracement". Worth
      # setting because the KNOWLEDGE phase copies the speaker's terminology verbatim, so an ASR
      # error reaches the knowledge units. Keep it a term list, never a sentence — whisper will
      # continue a prompt that does not match the audio.
      VIDINGEST_TRANSCRIPTION_PROMPT: ${VIDINGEST_TRANSCRIPTION_PROMPT:-break of structure, BOS, change of character, CHoCH, liquidity sweep, fib retracement, Fibonacci, order block, higher low, lower high, market structure shift, stop loss, NASDAQ, NQ1, LuxAlgo}
      # Speaker diarization (optional). Flip enabled + start the diarize-asr sidecar (needs
      # HUGGINGFACE_TOKEN) to opt in. Intentionally NOT a depends_on so vidingest starts without it.
      VIDINGEST_DIARIZATION_ENABLED: ${VIDINGEST_DIARIZATION_ENABLED:-false}
      VIDINGEST_DIARIZATION_BASE_URL: ${VIDINGEST_DIARIZATION_BASE_URL:-http://diarize-asr:9001}
      VIDINGEST_DIARIZATION_MAX_SPEAKERS: ${VIDINGEST_DIARIZATION_MAX_SPEAKERS:-8}
      VIDINGEST_DIARIZATION_MIN_OVERLAP_SECONDS: ${VIDINGEST_DIARIZATION_MIN_OVERLAP_SECONDS:-0.25}
      # Frame sampling (optional, pure-Java + ffmpeg — no sidecar).
      VIDINGEST_FRAMES_ENABLED: ${VIDINGEST_FRAMES_ENABLED:-false}
      VIDINGEST_FRAMES_INTERVAL_SECONDS: ${VIDINGEST_FRAMES_INTERVAL_SECONDS:-10}
      VIDINGEST_FRAMES_SCENE_CHANGE_THRESHOLD: ${VIDINGEST_FRAMES_SCENE_CHANGE_THRESHOLD:-0.35}
      VIDINGEST_FRAMES_MAX_PER_VIDEO: ${VIDINGEST_FRAMES_MAX_PER_VIDEO:-600}
      VIDINGEST_FRAMES_FFMPEG_TIMEOUT: ${VIDINGEST_FRAMES_FFMPEG_TIMEOUT:-PT20M}
      # OCR (optional). Requires the paddleocr-server sidecar. NOT a hard depends_on.
      VIDINGEST_OCR_ENABLED: ${VIDINGEST_OCR_ENABLED:-false}
      VIDINGEST_OCR_BASE_URL: ${VIDINGEST_OCR_BASE_URL:-http://paddleocr-server:8002}
      VIDINGEST_OCR_LANGUAGES: ${VIDINGEST_OCR_LANGUAGES:-en}
      VIDINGEST_OCR_MIN_CONFIDENCE: ${VIDINGEST_OCR_MIN_CONFIDENCE:-0.5}
      VIDINGEST_OCR_MAX_RESULTS_PER_VIDEO: ${VIDINGEST_OCR_MAX_RESULTS_PER_VIDEO:-10000}
      # Knowledge extraction (optional). Chat on the host runtime; the model must already be
      # available there. CHAT_MODEL is the id the host uses, not an ollama tag — oMLX names it
      # e.g. Qwen2.5-14B-Instruct-4bit, ollama names the same weights qwen2.5:14b-instruct.
      VIDINGEST_KNOWLEDGE_ENABLED: ${VIDINGEST_KNOWLEDGE_ENABLED:-false}
      VIDINGEST_KNOWLEDGE_PROVIDER: ${VIDINGEST_KNOWLEDGE_PROVIDER:-openai-compatible}
      VIDINGEST_KNOWLEDGE_CHAT_MODEL: ${VIDINGEST_KNOWLEDGE_CHAT_MODEL:-Qwen2.5-14B-Instruct-4bit}
      VIDINGEST_KNOWLEDGE_BASE_URL: ${VIDINGEST_KNOWLEDGE_BASE_URL:-${VK_HOST_LLM_URL:-http://host.docker.internal:8000/v1}}
      VIDINGEST_KNOWLEDGE_API_KEY: ${VIDINGEST_KNOWLEDGE_API_KEY:-}
      VIDINGEST_KNOWLEDGE_TEMPERATURE: ${VIDINGEST_KNOWLEDGE_TEMPERATURE:-0.2}
      VIDINGEST_KNOWLEDGE_MAX_OUTPUT_TOKENS: ${VIDINGEST_KNOWLEDGE_MAX_OUTPUT_TOKENS:-8192}
      VIDINGEST_KNOWLEDGE_MAX_INPUT_CHARS_PER_BATCH: ${VIDINGEST_KNOWLEDGE_MAX_INPUT_CHARS_PER_BATCH:-16000}
      VIDINGEST_KNOWLEDGE_MAX_UNITS_PER_VIDEO: ${VIDINGEST_KNOWLEDGE_MAX_UNITS_PER_VIDEO:-300}
      VIDINGEST_KNOWLEDGE_MIN_SALIENCE: ${VIDINGEST_KNOWLEDGE_MIN_SALIENCE:-0.2}
      VIDINGEST_KNOWLEDGE_EMBED_CONTENT: ${VIDINGEST_KNOWLEDGE_EMBED_CONTENT:-true}
    volumes:
      - app_logs:/app/logs
      - vidingest_data:/data/videos
    networks:
      - video-knowledge
    depends_on:
      postgres:
        condition: service_healthy
    # The LLM runtime lives on the host, so it cannot be a depends_on. Neither can the two
    # optional sidecars, deliberately — vidingest starts without them and the phases that need
    # them are opt-in. Check any of them with POST /api/v1/connections/{name}/test.
    extra_hosts:
      - 'host.docker.internal:host-gateway'
    # 768M left ~22M of slack once the 75%-of-limit heap and 151M of committed non-heap were
    # counted, and OCR buffers whole frames for multipart upload in native memory that neither
    # of those numbers covers. 1G gives the same 75% split real headroom; the JVM re-scales on
    # its own because nothing pins -Xmx any more.
    mem_limit: 1G
    mem_reservation: 256M
    restart: "no"

  # The operator console as its own container. The same bundle is also baked into the vidingest jar
  # (that is what makes the jar deployable alone), so with this service running the console is
  # reachable two ways: here on WEBAPP_PORT, and from the server itself on VIDINGEST_PORT. This one
  # can be rebuilt and restarted without touching the server, which is the reason it exists.
  #
  # nginx proxies the API rather than the app being told where the server is: every request the
  # console makes is relative and there is no CORS config on the server, so the two must stay
  # same-origin. See applications/webapp/nginx.conf.
  webapp:
    build:
      context: applications/webapp
      dockerfile: Dockerfile
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:24-alpine}
        NGINX_IMAGE: ${NGINX_IMAGE:-nginxinc/nginx-unprivileged:1.27-alpine}
    image: video-knowledge/webapp:${VK_IMAGE_TAG:-latest}
    ports:
      - '${VK_BIND_ADDR:-127.0.0.1}:${WEBAPP_PORT:-8052}:8080'
    depends_on:
      # Only for start order — nginx proxies lazily, so the console still loads and reports the
      # failure itself if the server goes away later.
      vidingest:
        condition: service_healthy
    networks:
      - video-knowledge
    mem_limit: 128M
    mem_reservation: 32M
    restart: unless-stopped

