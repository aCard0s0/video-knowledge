services:
  postgres:
    # pgvector on the official postgres base. `vector` is the only extension the schema needs
    # (001-core-pipeline.sql); there are no hypertables and no time_bucket anywhere, so the
    # timescaledb-ha image this replaced was carrying a preloaded extension nothing called.
    # Pinned to the same tag Testcontainers uses in BaseVidingestIntegrationTest — keep them
    # equal so a pg/pgvector behaviour difference cannot pass tests and fail in compose.
    # Staying on pg17: postgres 18 moved PGDATA to /var/lib/postgresql/<major>/docker, which
    # changes the mount below and makes the volume major-version-specific.
    image: 'pgvector/pgvector:pg17'
    command:
      - postgres
      - -c
      - max_connections=400
      - -c
      - shared_buffers=512MB
      - -c
      - effective_cache_size=1GB
      - -c
      - work_mem=16MB
    environment:
      - 'POSTGRES_DB=tradingPlatformDB'
      - 'POSTGRES_USER=dealer'
      - 'POSTGRES_PASSWORD=dev_dealer'
    labels:
      - "org.springframework.boot.service-connection=postgres"
    ports:
      - '${VK_BIND_ADDR:-127.0.0.1}:${POSTGRES_PORT:-3030}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    mem_limit: 2G
    mem_reservation: 1G
    healthcheck:
      # -h 127.0.0.1 forces TCP. Without it pg_isready uses the unix socket, and the official
      # entrypoint runs a socket-only temp server while it initialises a fresh volume — so the
      # check reports healthy before the database exists and depends_on releases vidingest early.
      # Never bit us on the old image because the volume was always already initialised; the new
      # postgres_data volume makes the first-init path live.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U dealer -d tradingPlatformDB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - video-knowledge

  paddleocr-server:
    # PaddleOCR sidecar (optional — VidIngest OCR, disabled by default). Receives one JPG per
    # request via multipart upload and returns line-level detections with confidence scores.
    build:
      # Build context resolves relative to the project directory (cwd of `docker compose`).
      # vk always runs from the repo root, so the sidecar lives at compose/infra/paddleocr-server.
      context: compose/infra/paddleocr-server
      dockerfile: Dockerfile
    image: video-knowledge/paddleocr-server:${VK_IMAGE_TAG:-latest}
    ports:
      - '${VK_BIND_ADDR:-127.0.0.1}:${PADDLEOCR_PORT:-8002}:8002'
    environment:
      - OCR_DEFAULT_LANG=${OCR_DEFAULT_LANG:-en}
      - PORT=8002
      - LOG_LEVEL=${PADDLEOCR_LOG_LEVEL:-INFO}
    volumes:
      - ai_models:/models
      # Read-only mount of the shared vidingest data volume (forward-compatible with read-by-path).
      - vidingest_data:/data/videos:ro
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8002/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - video-knowledge
    # 3G put PaddleOCR permanently in direct reclaim on text-dense frames. Recognition cost is
    # per detected box, so a chart capture with 141 lines needs far more resident memory than a
    # talking-head frame with four. At 3G the cgroup reported anon 2.88G against the 3G cap,
    # `memory.events max` 27179 hard-limit hits, pgscan_direct 12.2M and workingset_refault_anon
    # 3.8M — it was evicting its own working set and faulting it back on every allocation, which
    # is charged synchronously to the request. Same frame, same code: 40-44s at 3G, 17-19s at 6G,
    # with every reclaim counter back to zero. It never OOM-killed, so this only ever showed up as
    # latency and as wild run-to-run variance.
    mem_limit: ${PADDLEOCR_MEM_LIMIT:-6G}
    mem_reservation: 1G
    restart: unless-stopped

  diarize-asr:
    # Speaker-diarization sidecar wrapping pyannote.audio 3.x (optional — disabled by default).
    # Requires HUGGINGFACE_TOKEN — pyannote/speaker-diarization-3.1 is a gated model. Accept
    # the EULA on huggingface.co and set the token in the host environment (.env or shell).
    build:
      context: compose/infra/diarize-asr
      dockerfile: Dockerfile
    image: video-knowledge/diarize-asr:${VK_IMAGE_TAG:-latest}
    ports:
      - '${VK_BIND_ADDR:-127.0.0.1}:${DIARIZE_ASR_PORT:-9001}:9001'
    environment:
      - HUGGINGFACE_TOKEN=${HUGGINGFACE_TOKEN:-}
      - DIARIZATION_PIPELINE=${DIARIZATION_PIPELINE:-pyannote/speaker-diarization-3.1}
      - PORT=9001
      - LOG_LEVEL=${DIARIZE_ASR_LOG_LEVEL:-INFO}
    volumes:
      - ai_models:/models
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:9001/health"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - video-knowledge
    mem_limit: 4G
    mem_reservation: 1G
    restart: unless-stopped
